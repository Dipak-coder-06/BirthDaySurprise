    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#heartGradient)" filter="url(#glow)" opacity="0.2"/>
  <path d="M50 30 C35 20 20 35 20 50 C20 65 35 80 50 95 C65 80 80 65 80 50 C80 35 65 20 50 30 Z" fill="url(#heartGradient)" filter="url(#glow)"/>
